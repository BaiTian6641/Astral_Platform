# eth_rv SoC configuration (E2-RV2 increment 5, S3).
#
# The single checked-in source of the SoC address map and boot contract. It is
# mirrored by verif/eth_rv/rv_platform.py (what the DiffTest harness executes)
# and by verif/eth_rv/eth_rv.dts (the device tree Spike is pointed at with
# --dtb); verif/eth_rv/tests/test_rv_platform.py fails if the three disagree.
#
# Flat key: value scalars only -- see rv_platform.read_core_yaml.

hart_count: 1
isa: rv64imafdc_zicsr_zicntr

# RAM window: one number shared by the testbench's behavioural memory
# (-DETH_RV_MEM_BYTES), eth_rv_axi_master's MEM_BYTES and Spike's
# `-m0x80000000:<ram_window_bytes>`.
ram_base: 0x80000000
ram_window_bytes: 1048576

# BootROM: reset vector (eth_rv_pkg RESET_PC), the stub's instruction-count word
# (the TB derives the CLINT mtime phase from it) and the payload-entry word.
rom_base: 0x1000
rom_bytes: 4096
rom_step_offset: 28
rom_entry_offset: 32

# Device tree blob: 8 KiB into RAM; the ROM stub leaves this in a1.
dtb_addr: 0x80002000

# Console UART (ns16550a) and CLINT, as the device tree declares them.
uart_base: 0x10000000
uart_reg_bytes: 256
clint_base: 0x2000000
clint_bytes: 49152

# PLIC (E2-RV2 increment 6): Spike's window and source map. `uart_irq` is the
# console UART's source id, and the S context of the PLIC is what gives the hart
# a hardware `mip.SEIP` (mideleg.SEI) for a kernel's driver to attach to.
plic_base: 0xc000000
plic_bytes: 16777216
plic_ndev: 31
plic_prio_bits: 4
uart_irq: 1

clock_hz: 1000000000
timebase_frequency: 10000000

# --- S4 Linux-boot profile (E2-RV2 increment 7) ---------------------------------
# The keys above are the S3/S5 DiffTest-corpus contract (1 MiB window, DTB right
# above the corpus image). These are the S4 profile, which boots OpenSBI -> Linux
# and therefore needs a bigger window: the kernel Image alone is 22.4 MiB
# (text_offset 0x200000, image_size 0x15d6000), the firmware occupies
# 0x80000000..0x80042000, and the initramfs sits at the top of the window.
# Mirrored by verif/eth_rv/rv_platform.py (LINUX_*) and by
# verif/eth_rv/eth_rv_linux.dts (the tree the kernel is given).
#
# linux_ram_window_bytes: 40 MiB = 0x2800000. The minimum a stock OpenSBI fw_jump
#   layout needs is 34.01 MiB (kernel 0x80200000..0x817d6000, DTB at the stock
#   FW_JUMP_FDT_ADDR slot 0x82200000); 40 MiB is that plus slack for the initramfs
#   and a larger tree.
# linux_fw_addr: where fw_jump.bin is loaded (= FW_TEXT_START = the BootROM's
#   handoff target).
# linux_kernel_addr: FW_JUMP_OFFSET = the Image's text_offset (they must agree).
# linux_dtb_addr: the stock FW_JUMP_FDT_ADDR slot; fw_jump relocates the tree here
#   before entering the kernel, so this is the address a kernel always sees.
# linux_rom_dtb_addr: 0x1020, where the S4 BootROM keeps the tree (Spike's own
#   reset-ROM slot). The BootROM is 4 KiB at 0x1000, so the tree must fit in
#   4064 B; the build fails if it does not.
# linux_initrd_end: Spike's --initrd convention (mem_base + size - 0x1000); the
#   start is end - <initramfs size> and is substituted into the DT by the build.
linux_ram_window_bytes: 41943040
linux_fw_addr: 0x80000000
linux_kernel_addr: 0x80200000
linux_dtb_addr: 0x82200000
linux_rom_dtb_addr: 0x1020
linux_initrd_end: 0x827ff000
