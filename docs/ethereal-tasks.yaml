# Ethereal Logic Platform — 机器可读任务清单 v2.1
# 与《Ethereal-平台实施蓝图-v2.md》及《Ethereal-蓝图v2.1-BMC与运行时修订.md》配套。
# v2.1 变更：弃用 GW5 AE350 硬核（付费工具链）；管理单元改为 fabric 内 RISC-V 软核（BMC，
# 主选 NEORV32），小器件降级为 mFSM（与 BMC 统一 EMRI 寄存器 ABI）。
# 字段说明：
#   id / title / phase / deps / est_days / deliverable / acceptance / status

project:
  name: Ethereal Logic Platform
  decisions:
    route: overlay-first (fine-grained virtual reconfigurable fabric)
    platforms: [gowin-gw5ast-138, zynq-ultrascale-plus]
    licenses: {software: MIT, hardware_rtl: CERN-OHL-S-2.0, docs_specs: CC-BY-SA-4.0}
    bus: EBI (AXI4-Lite + custom NoC + tiny fallback)
    host_link: {data: SPI, monitor: I2C (PMBus-style)}
    control_plane: independent-then-unified (ADR-010)
    management:
      bmc: soft-core RISC-V in fabric (primary: NEORV32, fallback: VexRiscv)  # ADR-013/016
      small_devices: mFSM (register-based, host-driven)                        # ADR-014
      unified_abi: EMRI (BMC and mFSM expose identical register interface)     # ADR-015
      deprecated: gowin-ae350-hardcore (paid toolchain, unusable software)

phases:
  - id: phase-0
    name: 基础设施与仿真验证
    window: M0-M2
    exit_criteria:
      - 仿真内双镜像热替换演示通过
      - AES-128 与 FIR16 基准在虚拟 fabric 上 bit-true
      - MAP 路线决策 ADR-012 完成
      - CI 全绿
    circuit_breaker: VPR 架构 2 周不收敛则转 FABulous/nextpnr 或自研 placer+router（各 5 人日上限）

  - id: phase-1
    name: GW5 bring-up 最小闭环（BMC 软核版）
    window: M2-M5
    exit_criteria:
      - BMC 软核运行 daemon，ethctl run/stop/ps/restart 全通
      - 2 region x 10000 次热替换零故障
      - v0.1.0 公开发布（视频+博客+文档站）
    circuit_breaker: BMC 固件通道受阻则临时以上位机直驱 EMRI/OCC 保底（mFSM 语义先行）

  - id: phase-2
    name: 异构 fabric v2 + Zynq 移植 + mFSM + Astral 聚合 v1
    window: M5-M9
    exit_criteria:
      - 同一 logic image 在 GW5 与 Zynq US+ 直接运行（二进制兼容）
      - 异构 tile 基准报告（AES-MEM 密度 >=5x, FIR-DSP 吞吐 >=10x）
      - mFSM 在仿真中由上位机驱动完整部署流程
      - Astral Type-F 聚合演示
      - EBI/镜像/BoardManifest/EFP 规范 v1.0 冻结

  - id: phase-3
    name: Service Tile + 调度 + 安全 + 学术发布
    window: M9-M15
    exit_criteria:
      - NPU-Tiny 推理 demo + 多容器分时复用
      - 容器迁移/抢占演示（BMC 编排上下文保存）
      - OCI 镜像仓库 push/pull
      - 论文投稿（FPL/FCCM/TRETS）

  - id: phase-4
    name: 编排与生态
    window: M15-M24
    exit_criteria:
      - 统一编排器（bundle/多板/声明式）
      - BMC 固件迁移 Zephyr，BMC 成为 Astral 节点
      - 4 个参考设计套件
      - >=2 名核心外部贡献者

  - id: phase-5
    name: 商业级演进
    window: M24+
    exit_criteria:
      - 企业版编排/RBAC/远程运维（BMC 健康审计为卖点）
      - 安全认证预评估材料
      - 镜像仓库 SaaS / 厂商合作

